[project]
name = "context-nine-vault-tui"
version = "0.1.0"
description = "Textual control room for Context Nine vault commands."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "rich>=13.9.4",
  "textual>=0.85.2",
]

[project.scripts]
vault-tui = "context_nine_vault_tui.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

